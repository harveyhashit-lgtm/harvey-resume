<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>OMS Ops Bot · Harvey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060b;--text:#e8eaf2;--muted:#7f869b;--border:rgba(255,255,255,.1);--a1:#8b5cf6;--a2:#22d3ee;--a3:#34f5a6;--err:#f472b6}
@media (prefers-color-scheme:light){:root{--bg:#f5f6fb;--text:#121528;--muted:#6b7288;--border:rgba(20,24,48,.12);--a1:#6d3df5;--a2:#0891b2;--a3:#059669;--err:#db2777}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Inter",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;overflow:hidden;padding:16px}
.glow{position:fixed;inset:-30%;z-index:0;filter:blur(90px);opacity:.5;pointer-events:none}
.glow i{position:absolute;border-radius:50%;animation:f 18s ease-in-out infinite}
.glow i:nth-child(1){width:46vw;height:46vw;left:10%;top:10%;background:radial-gradient(circle,rgba(139,92,246,.6),transparent 65%)}
.glow i:nth-child(2){width:40vw;height:40vw;right:5%;bottom:5%;background:radial-gradient(circle,rgba(34,211,238,.5),transparent 65%);animation-delay:-9s}
@keyframes f{50%{transform:translate(6%,5%) scale(1.1)}}
.box{position:relative;z-index:1;width:min(420px,100%);padding:36px 32px 30px;border:1px solid var(--border);border-radius:22px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 40px 90px -30px rgba(0,0,0,.6);text-align:center}
.logo{width:52px;height:52px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;color:#fff;font:700 22px "Space Grotesk",sans-serif;background:linear-gradient(120deg,var(--a1),var(--a2) 50%,var(--a3));box-shadow:0 0 40px -6px var(--a2)}
h1{margin:0;font:700 26px "Space Grotesk","Inter",sans-serif;letter-spacing:-.02em}
.sub{margin:6px 0 26px;color:var(--muted);font-size:14px}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--text);font:500 16px "JetBrains Mono",monospace;letter-spacing:.18em;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--a2);box-shadow:0 0 0 4px color-mix(in srgb,var(--a2) 18%,transparent)}
button{padding:14px;border:0;border-radius:12px;color:#fff;font:600 15px "Inter",sans-serif;cursor:pointer;background:linear-gradient(110deg,var(--a1),var(--a2) 50%,var(--a3));background-size:200% 100%;transition:background-position .6s,opacity .2s}
button:hover{background-position:100% 0}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;font-size:13px;color:var(--err)}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{margin-top:18px;font:500 11px "JetBrains Mono",monospace;letter-spacing:.12em;color:var(--muted)}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i></div>

  </form>

  var b=function(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})};
  async function unlock(code){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(code.trim()),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(DATA));
    return new TextDecoder().decode(buf);
  }
  function show(html){ document.open(); document.write(html); document.close(); if(/code=/.test(location.hash)) history.replaceState(null,'',location.pathname+location.search); }
  var f=document.getElementById('f'), inp=document.getElementById('code'), btn=document.getElementById('btn'), msg=document.getElementById('msg'), box=document.getElementById('box');
  async function attempt(code, silent){
    btn.disabled=true; btn.textContent='解锁中…'; msg.textContent='';
    try{ var html=await unlock(code); try{sessionStorage.setItem('hv-code',code)}catch(e){} show(html); }
    catch(e){ btn.disabled=false; btn.textContent='解锁简历'; if(!silent){ msg.textContent='访问码不正确，请重试'; box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake'); inp.select(); } }
  }
  f.addEventListener('submit',function(e){ e.preventDefault(); if(inp.value.trim()) attempt(inp.value,false); });
  // Link with code in the hash (never sent to the server): .../#code=xxxx
  var m=location.hash.match(/code=([^&]+)/);
  if(m){ var c=decodeURIComponent(m[1]); history.replaceState(null,'',location.pathname+location.search); attempt(c,false); return; }

  if(saved) attempt(saved,true);
})();
